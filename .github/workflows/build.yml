name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: 生成gradle脚本
        run: |
          curl https://raw.githubusercontent.com/gradle/gradle/master/gradlew -o gradlew
          curl https://raw.githubusercontent.com/gradle/gradle/master/gradlew.bat -o gradlew.bat
          chmod +x gradlew

      - name: 打包Release
        run: ./gradlew assembleRelease

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/outputs/apk/release/*.apk
